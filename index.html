<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23 ANS OMG</title>
    <meta name="description" content="M'engueule pas je voulais pas t'écrire juste un mot">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>

    <!-- Floating soft shapes -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
    </div>

    <!-- Main content -->
    <main class="hero">
        <div class="card" id="mainCard">
            <div class="card-glow"></div>
            <div class="emoji-container">
                <span class="wave-emoji" id="waveEmoji">👋</span>
            </div>
            <h1 class="card-title">Salut toi</h1>
            <p class="card-subtitle">Tu voulais juste un message pour ton anniversaire&nbsp;?<br>Voici un message, et
                bien plus&nbsp;!</p>
            <a href="page2.html" class="cta-button" id="ctaButton">
                <span class="cta-text">Découvrir</span>
                <span class="cta-arrow">→</span>
            </a>
            <!-- Decorative dots under the card -->
            <div class="card-dots">
                <span class="dot dot-active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
